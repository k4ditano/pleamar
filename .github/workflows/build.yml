name: Native builds and language tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libfontconfig1-dev libpam0g-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build with Luau
        run: cargo build --release --locked
      - name: Package and verify the Windows shader compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'dxc_2026_09_29.zip'
          Invoke-WebRequest -Uri 'https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/dxc_2026_09_29.zip' -OutFile $archive
          ./scripts/prepare-windows-runtime.ps1 -Archive $archive
          ./scripts/test-windows-runtime.ps1 -Archive $archive
      - name: Unit tests with Luau
        run: cargo test --locked
      - name: Allocation diagnostic bookkeeping
        run: cargo test --locked --example allocation-profile
      - name: Build diagnostic executables
        run: cargo build --locked --example luau-test --example allocation-profile
      - name: Isolated Luau assertions without a desktop
        run: python scripts/test-luau-runner.py --runner target/debug/examples/luau-test${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Repeated compiler success and failure allocations
        run: python scripts/test-compile-memory.py --profiler target/debug/examples/allocation-profile${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Scenes, documentation and editor contracts
        run: python scripts/run-tests.py
      - name: Windows CLI smoke
        if: runner.os == 'Windows'
        run: python scripts/windows-smoke.py --binary target/release/pleamar.exe
      - name: Windows service and Luau reloads without a display
        if: runner.os == 'Windows'
        run: python scripts/windows-service-reload.py --binary target/release/pleamar.exe --output "${{ runner.temp }}/service reload ñ"
      - name: Windows watcher ownership and plugin approval reloads
        if: runner.os == 'Windows'
        run: python scripts/windows-watch-reload.py --binary target/release/pleamar.exe --output "${{ runner.temp }}/watch reload ñ"
      - name: Windows callback isolation across plugin insertion
        if: runner.os == 'Windows'
        run: python scripts/windows-callback-isolation.py --binary target/release/pleamar.exe --output "${{ runner.temp }}/callback isolation ñ"
      - name: Windows subprocess lifetime across Luau reloads
        if: runner.os == 'Windows'
        run: python scripts/windows-run-lifetime.py --binary target/release/pleamar.exe --output "${{ runner.temp }}/run lifetime ñ"
      - name: Build Windows recording decoder
        if: runner.os == 'Windows'
        run: cargo build --locked --example recording-inspect
      - name: Build Windows notification status diagnostic
        if: runner.os == 'Windows'
        run: cargo build --locked --example notifications-status
      - name: Build Windows tray fixture (interactive validation is separate)
        if: runner.os == 'Windows'
        run: cargo build --locked --example tray-fixture
      - name: Build Windows media fixture (interactive validation is separate)
        if: runner.os == 'Windows'
        run: cargo build --locked --example media-fixture
      - name: Build Windows shelf fixture (interactive validation is separate)
        if: runner.os == 'Windows'
        run: cargo build --locked --example window-fixture
      - name: Additional core diagnostic without Luau
        run: cargo check --locked --no-default-features
      - name: Preserve Windows reload diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: native-reload-diagnostics
          path: |
            ${{ runner.temp }}/service reload ñ
            ${{ runner.temp }}/watch reload ñ
            ${{ runner.temp }}/callback isolation ñ
            ${{ runner.temp }}/run lifetime ñ
          if-no-files-found: ignore
