name: Portable regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libfontconfig1-dev libpam0g-dev pkg-config fonts-dejavu-core
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-workspace-crates: false
          cache-bin: false
      - run: cargo test --locked
      - run: cargo test --locked --example allocation-profile
      - run: cargo build --locked --example allocation-profile
      - run: python3 scripts/test-compile-memory.py --profiler target/debug/examples/allocation-profile
      - run: sh run-tests.sh
