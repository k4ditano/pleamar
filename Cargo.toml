[package]
name = "pleamar"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
description = "A desktop shell language and runtime where animation does not depend on logic"
repository = "https://github.com/k4ditano/pleamar"

[dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
mlua = { version = "0.12", features = ["luau", "send"], optional = true }
pollster = "1.0.1"
resvg = { version = "0.48.1", default-features = false }
serde_json = "1.0.151"
wgpu = "30"

# Lo de cada sistema, solo en ese sistema. El núcleo no depende de nada de esto.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
zbus = "5"
raw-window-handle = "0.6"
smithay-client-toolkit = "0.21"
wayland-client = { version = "0.31", features = ["system"] }
# Los protocolos que entienden todos los compositores: ventanas y escritorios.
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# fontconfig da los alias de fuentes del sistema («sans-serif» → la que toque). Sin él,
# en Windows y macOS, fontdb lee las carpetas de fuentes directamente.
cosmic-text = { version = "0.19.0", default-features = false, features = ["fontconfig"] }

# La lógica en Luau trae consigo un compilador de C++: Luau se compila de sus
# fuentes. Es una característica para que el núcleo se pueda comprobar contra
# otros sistemas aunque aquí no haya compilador cruzado. Ver portable.sh.
[features]
default = ["luau"]
luau = ["dep:mlua"]
