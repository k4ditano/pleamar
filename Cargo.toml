[package]
name = "pleamar"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
pollster = "1.0.1"
resvg = { version = "0.48.1", default-features = false }
wgpu = "30"

# Lo de cada sistema, solo en ese sistema. El núcleo no depende de nada de esto.
[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
smithay-client-toolkit = "0.21"
wayland-client = { version = "0.31", features = ["system"] }
# fontconfig da los alias de fuentes del sistema («sans-serif» → la que toque). Sin él,
# en Windows y macOS, fontdb lee las carpetas de fuentes directamente.
cosmic-text = { version = "0.19.0", default-features = false, features = ["fontconfig"] }
